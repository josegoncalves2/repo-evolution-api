

services:
  # ---------------------------------------------------------------
  # Evolution API (v2)
  # ---------------------------------------------------------------
  evolution-api:
    container_name: evolution_api
    image: evoapicloud/evolution-api:latest
    restart: always
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution-net

  # ---------------------------------------------------------------
  # Evolution Manager (Interface Web)
  # ---------------------------------------------------------------
  evolution-manager:
    container_name: evolution_manager
    image: evoapicloud/evolution-manager:latest
    restart: always
    depends_on:
      evolution-api:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ./nginx-manager.conf:/etc/nginx/conf.d/nginx.conf
    networks:
      - evolution-net

  # ---------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------
  evolution-postgres:
    container_name: evolution_postgres
    image: postgres:15
    restart: always
    env_file:
      - .env
    command:
      - postgres
      - -c
      - max_connections=1000
      - -c
      - listen_addresses=*
    environment:
      - POSTGRES_DB=${POSTGRES_DATABASE}
      - POSTGRES_USER=${POSTGRES_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - evolution-net

  # ---------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------
  evolution-redis:
    container_name: evolution_redis
    image: redis:latest
    restart: always
    command: redis-server --port 6379 --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - evolution_redis:/data
    networks:
      - evolution-net

  # ---------------------------------------------------------------
  # MinIO (agora via Quay.io)
  # ---------------------------------------------------------------
  evolution-minio:
    container_name: evolution_minio
    image: quay.io/minio/minio:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio_data:/data
    networks:
      - evolution-net

  # ---------------------------------------------------------------
  # Criação automática do bucket (agora via Quay.io)
  # ---------------------------------------------------------------
  minio-create-bucket:
    container_name: minio_create_bucket
    image: quay.io/minio/mc:latest
    depends_on:
      evolution-minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://evolution-minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}) do echo 'Aguardando MinIO...' && sleep 3; done;
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET};
      exit 0;
      "
    networks:
      - evolution-net

volumes:
  evolution_instances:
  postgres_data:
  evolution_redis:
  minio_data:

networks:
  evolution-net:
    name: evolution-net
    driver: bridge

